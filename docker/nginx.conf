map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Keep directory redirects on the browser's host and published port.
    absolute_redirect off;

    # Resolve the service again after a relay container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $relay_upstream http://relay:8080;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /relay {
        proxy_pass $relay_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location = /relay/health {
        proxy_pass $relay_upstream/health;
    }

    location = /health {
        proxy_pass $relay_upstream/health;
    }
}
