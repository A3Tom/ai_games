# Pull and run the complete collection from GHCR.
services:
  games:
    image: ghcr.io/${GHCR_REPOSITORY:-a3tom/ai_games}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-14650}:14650"
    environment:
      MAX_ROOMS: "${MAX_ROOMS:-100}"
      MAX_CLIENTS_PER_ROOM: "${MAX_CLIENTS_PER_ROOM:-4}"
      ROOM_TIMEOUT_MS: "${ROOM_TIMEOUT_MS:-3600000}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      INSTANCE_ID: "${INSTANCE_ID:-}"
      OBSERVABILITY_ENVIRONMENT: "${OBSERVABILITY_ENVIRONMENT:-production}"
      VICTORIALOGS_URL: "${VICTORIALOGS_URL:-}"
      VICTORIALOGS_TOKEN: "${VICTORIALOGS_TOKEN:-}"
      TELEMETRY_ALLOWED_ORIGINS: "${TELEMETRY_ALLOWED_ORIGINS:-}"
