# Pull and run the complete collection from GHCR.
services:
  games:
    image: ghcr.io/${GHCR_REPOSITORY:-a3tom/ai_games}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      MAX_ROOMS: "${MAX_ROOMS:-100}"
      MAX_CLIENTS_PER_ROOM: "${MAX_CLIENTS_PER_ROOM:-4}"
      ROOM_TIMEOUT_MS: "${ROOM_TIMEOUT_MS:-3600000}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
