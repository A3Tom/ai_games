name: Build game artifact images

on:
  workflow_call:
    inputs:
      force_rebuild:
        description: Rebuild all game images even when their inputs match
        type: boolean
        default: false
    outputs:
      images:
        description: JSON map of game folder names to digest-pinned artifact images
        value: ${{ jobs.resolve.outputs.images }}
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild all game images even when their inputs match
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.games.outputs.matrix }}
      has_games: ${{ steps.games.outputs.has_games }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check game image build tooling
        run: node --test scripts/game-images.test.mjs
      - name: Discover game Dockerfiles and fingerprint build inputs
        id: games
        run: node scripts/game-images.mjs discover
        env:
          GAME_IMAGE_VARIABLES: ${{ toJSON(vars) }}

  build:
    needs: discover
    if: needs.discover.outputs.has_games == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    # All callers share the lock, including Pages and collection publishing.
    # Lock the game rather than its source key so latest updates cannot race.
    concurrency:
      group: game-image-${{ matrix.id }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare inputs with the published game
        id: existing
        run: node scripts/game-images.mjs check
        env:
          GAME_IMAGE_BUILD: ${{ toJSON(matrix) }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}

      - name: Build and publish changed game
        if: steps.existing.outputs.build == 'true'
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          pull: true
          no-cache: ${{ inputs.force_rebuild }}
          tags: ${{ matrix.tag }}
          build-args: ${{ matrix.buildArgs }}
          labels: |
            io.ai-games.build-inputs=${{ matrix.key }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=game-${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=game-${{ matrix.id }}

      - name: Record immutable image and update latest on the default branch
        run: node scripts/game-images.mjs record
        env:
          GAME_IMAGE_BUILD: ${{ toJSON(matrix) }}
          RESOLVED_IMAGE: ${{ steps.existing.outputs.image }}
          BUILT_DIGEST: ${{ steps.publish.outputs.digest }}
          GAME_IMAGE_RESULTS: ${{ runner.temp }}/game-images
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Share resolved game image
        uses: actions/upload-artifact@v4
        with:
          name: game-image-${{ matrix.id }}
          path: ${{ runner.temp }}/game-images/${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 1

  resolve:
    needs: [discover, build]
    if: ${{ always() && needs.discover.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download resolved game images
        if: needs.discover.outputs.has_games == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: game-image-*
          merge-multiple: true
          path: ${{ runner.temp }}/game-images
      - name: Collect the complete image map for hosting builds
        id: images
        run: node scripts/game-images.mjs collect
        env:
          GAME_IMAGE_BUILDS: ${{ needs.discover.outputs.matrix }}
          GAME_IMAGE_RESULTS: ${{ runner.temp }}/game-images
