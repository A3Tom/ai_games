name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Emscripten 4.0.23
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.23
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.23

      - name: Install relay and shared client dependencies
        run: |
          npm ci --prefix relay
          npm ci --prefix packages/multiplayer

      - name: Check multiplayer protocol and client
        run: |
          npm test --prefix relay
          npm run build --prefix relay
          npm test --prefix packages/multiplayer
          npm run type-check --prefix packages/multiplayer
      
      - name: Install, build, and package all registered games
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          node scripts/build-collection.mjs --install --build
        env:
          VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL }}
          VITE_PINBALL_API_URL: ${{ vars.VITE_PINBALL_API_URL }}
          PINBALL_SKIP_RESOURCE_DOWNLOAD: ${{ vars.PINBALL_SKIP_RESOURCE_DOWNLOAD }}

      - name: Check Dots and Boxes rules and synchronization
        run: npm test --prefix dots-and-boxes

      - name: Check pinball frontend and leaderboard
        run: npm test --prefix pinball
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy'
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
