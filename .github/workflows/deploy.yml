name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install relay and shared client dependencies
        run: |
          npm ci --prefix relay
          npm ci --prefix packages/multiplayer

      - name: Check multiplayer protocol and client
        run: |
          npm test --prefix relay
          npm run build --prefix relay
          npm test --prefix packages/multiplayer
          npm run type-check --prefix packages/multiplayer
      
      - name: Install, build, and package all registered games
        run: node scripts/build-collection.mjs --install --build
        env:
          VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL }}

      - name: Check Dots and Boxes rules and synchronization
        run: npm test --prefix dots-and-boxes
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy'
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
