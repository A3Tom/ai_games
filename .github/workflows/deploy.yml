name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  games:
    uses: ./.github/workflows/game-images.yml

  build:
    needs: games
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check collection build tooling
        run: npm run test:tooling

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract prebuilt games
        id: artifacts
        env:
          GAME_IMAGES: ${{ needs.games.outputs.images }}
        run: node scripts/extract-game-images.mjs

      - name: Configure Pinball for Pages
        run: node games/pinball/scripts/configure-runtime.mjs
        env:
          VITE_PINBALL_API_URL: ${{ vars.VITE_PINBALL_API_URL }}

      - name: Install server and shared client dependencies
        run: |
          npm ci --prefix services/game-server
          npm ci --prefix packages/multiplayer

      - name: Check multiplayer protocol and client
        run: |
          npm test --prefix services/game-server
          npm run build --prefix services/game-server
          npm test --prefix packages/multiplayer
          npm run type-check --prefix packages/multiplayer
      
      - name: Install, build, and package all registered games
        run: |
          build_args=(--install --build)
          if [ -n "$SKIP_GAME_BUILDS" ]; then
            build_args+=("--skip-build=$SKIP_GAME_BUILDS")
          fi
          node scripts/build-collection.mjs "${build_args[@]}"
        env:
          SKIP_GAME_BUILDS: ${{ steps.artifacts.outputs.skip_build }}
          VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL }}
          VITE_PINBALL_API_URL: ${{ vars.VITE_PINBALL_API_URL }}
          PINBALL_SKIP_RESOURCE_DOWNLOAD: ${{ vars.PINBALL_SKIP_RESOURCE_DOWNLOAD }}

      - name: Check all registered games with tests
        run: node scripts/test-games.mjs
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy'
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
