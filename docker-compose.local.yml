# Build and run the complete collection from local source.
services:
  games:
    build: .
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-14650}:14650"
    environment:
      MAX_ROOMS: "${MAX_ROOMS:-100}"
      MAX_CLIENTS_PER_ROOM: "${MAX_CLIENTS_PER_ROOM:-4}"
      ROOM_TIMEOUT_MS: "${ROOM_TIMEOUT_MS:-3600000}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      INSTANCE_ID: "${INSTANCE_ID:-}"
      OBSERVABILITY_ENVIRONMENT: "${OBSERVABILITY_ENVIRONMENT:-development}"
      VICTORIALOGS_URL: "${VICTORIALOGS_URL:-}"
      VICTORIALOGS_TOKEN: "${VICTORIALOGS_TOKEN:-}"
      TELEMETRY_ALLOWED_ORIGINS: "${TELEMETRY_ALLOWED_ORIGINS:-}"
      PINBALL_SCORES_FILE: /data/pinball-scores.json
      PINBALL_ALLOWED_ORIGINS: "${PINBALL_ALLOWED_ORIGINS:-}"
    volumes:
      - pinball-data:/data

volumes:
  pinball-data:
