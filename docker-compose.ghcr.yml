# Standalone deployment manifest: no source checkout or local builds required.
services:
  web:
    image: ghcr.io/${GHCR_REPOSITORY:-a3tom/ai_games}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:80"
    depends_on:
      relay:
        condition: service_healthy

  relay:
    image: ghcr.io/${GHCR_REPOSITORY:-a3tom/ai_games}-relay:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      PORT: "8080"
      MAX_ROOMS: "${MAX_ROOMS:-100}"
      MAX_CLIENTS_PER_ROOM: "${MAX_CLIENTS_PER_ROOM:-4}"
      ROOM_TIMEOUT_MS: "${ROOM_TIMEOUT_MS:-3600000}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
